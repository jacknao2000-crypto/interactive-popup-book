<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拔苗助长 · 立体互动书原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#fbf1e1; --ink:#3a2b3f; --ink2:rgba(58,43,63,.62);
    --red:#e2665a; --pink:#f27fa5; --teal:#2fa39a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 30%,rgba(255,214,170,.28) 0%,rgba(0,0,0,0) 55%),
      radial-gradient(ellipse at 50% 120%,rgba(20,8,0,.55) 0%,rgba(0,0,0,0) 60%),
      repeating-linear-gradient(178deg,rgba(255,220,180,.05) 0 3px,rgba(0,0,0,.04) 3px 7px,rgba(0,0,0,0) 7px 19px),
      linear-gradient(#8a5a3c,#6b4129 60%,#52301e);
    font-family:"Noto Serif SC","Noto Serif CJK SC","Songti SC",serif;color:var(--ink);-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;touch-action:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
  header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 18px 0;pointer-events:none;gap:10px}
  .pill{background:rgba(255,248,238,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:26px;padding:8px 20px;
    box-shadow:0 4px 14px rgba(40,15,0,.25);display:flex;align-items:baseline;gap:12px;white-space:nowrap}
  .pill b{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:26px;letter-spacing:.06em;color:var(--ink)}
  .pill span{font-size:12px;letter-spacing:.18em;color:var(--ink2)}
  #pageName{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.06em;align-items:center}
  #pageName i{width:9px;height:9px;border-radius:50%;background:#f6a04d;display:inline-block;box-shadow:0 0 0 3px rgba(246,160,77,.25)}
  #stageWrap{flex:1;width:100%;position:relative;min-height:0}
  #fit{position:absolute;left:0;top:0;width:960px;height:820px;transform-origin:0 0}
  #world{position:absolute;inset:0;perspective:1700px;perspective-origin:50% 18%}
  #scene{position:absolute;left:20px;top:40px;width:920px;height:440px;transform-style:preserve-3d;
    transform-origin:50% 100%;transform:rotateX(-24deg);transition:transform .9s cubic-bezier(.45,0,.25,1)}
  #scene.closed{transform:translateY(-270px) rotateX(-75deg) rotateZ(-1.5deg) scale(.9)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;border-radius:6px}
  #back{position:absolute;left:0;top:0;width:920px;height:440px;transform-style:preserve-3d;transform-origin:50% 100%;
    transition:transform .55s cubic-bezier(.5,0,.3,1)}
  #back .front{background:var(--paper)}
  #back .rear{transform:rotateX(180deg);background:#f4e6cf}
  #back.cover .rear{background:#e2665a}
  #base{position:absolute;left:0;top:440px;width:920px;height:440px;transform-origin:50% 0;transform:rotateX(90deg);
    background:var(--paper);border-radius:0 0 6px 6px;transform-style:preserve-3d}
  #board{position:absolute;left:-12px;top:440px;width:944px;height:456px;transform-origin:50% 0;transform:rotateX(90deg) translateZ(-4px);
    background:#5b4a8f;border-radius:0 0 10px 10px;box-shadow:0 0 0 2px #463875}
  .paper::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.6;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .35  0 0 0 .2 0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
  .spine{position:absolute;left:0;right:0;top:0;height:22px;background:linear-gradient(rgba(90,40,30,.22),rgba(90,40,30,0))}
  #pieces{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
  .piece{pointer-events:none} .piece.seed{pointer-events:auto}
  .piece{position:absolute;bottom:0;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.45,.55,1),opacity .2s;will-change:transform}
  .piece svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px rgba(80,30,40,.32))}
  .piece.folded{transition:transform .42s cubic-bezier(.6,0,.8,.4)}
  .decal{position:absolute;pointer-events:none}
  .hole{position:absolute;width:56px;height:26px;margin:-13px 0 0 -28px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%,#7a3a2a 0%,#9a4a33 55%,rgba(154,74,51,0) 72%);pointer-events:auto;cursor:pointer}
  .hole.ring::before{content:"";position:absolute;inset:-10px -14px;border-radius:50%;border:3px dashed rgba(255,250,240,.95);
    animation:ring 1.4s ease-in-out infinite}
  @keyframes ring{0%,100%{transform:scale(.92);opacity:.5}50%{transform:scale(1.05);opacity:1}}
  .shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(90,35,40,.32),rgba(90,35,40,0) 70%);pointer-events:none}
  .wet{position:absolute;width:110px;height:54px;margin:-27px 0 0 -55px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(110,45,30,.7),rgba(110,45,30,0) 70%);opacity:0;transition:opacity 1s}
  .wet.on{opacity:1}
  .seed{cursor:grab}
  .seed.can-pull .hit{animation:wiggle 1.8s ease-in-out infinite;transform-origin:50% 100%}
  @keyframes wiggle{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-4deg)}86%{transform:rotate(4deg)}94%{transform:rotate(-2deg)}}
  .seed.tappable{cursor:pointer}
  #ui{position:absolute;inset:0;pointer-events:none}
  .bubble{position:absolute;max-width:230px;padding:10px 16px;background:#fff8ee;border-radius:18px;font-size:16px;line-height:1.45;
    box-shadow:0 0 0 3px #fff,0 6px 18px rgba(60,20,30,.3);transform:translate(-50%,-100%) scale(.6);opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:#fff8ee}
  .bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
  .chip{position:absolute;left:24px;top:14px;padding:7px 16px;border-radius:20px;background:#fff8ee;font-weight:600;font-size:15px;
    box-shadow:0 0 0 3px #fff,0 4px 12px rgba(60,20,30,.25);opacity:0;transition:opacity .3s;color:var(--ink)}
  .chip.show{opacity:1}
  #can{position:absolute;width:96px;height:80px;pointer-events:auto;cursor:grab;touch-action:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 6px 6px rgba(40,10,20,.35))}
  #can.show{opacity:1}
  #can.drag{cursor:grabbing;transition:none}
  #can .lbl{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:12px;color:#fff6e4;white-space:nowrap;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
  .drop{position:absolute;width:7px;height:11px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#6fc9e8;box-shadow:0 0 0 1.5px #fff;pointer-events:none;animation:drop .7s ease-in forwards}
  @keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(60px);opacity:0}}
  .pop{position:absolute;font-weight:700;color:#fff;font-size:18px;text-shadow:0 0 6px #f27fa5,0 2px 6px rgba(0,0,0,.35);pointer-events:none;animation:floatup 1.1s ease-out forwards;transform:translate(-50%,0)}
  @keyframes floatup{from{opacity:0;margin-top:0}20%{opacity:1}to{opacity:0;margin-top:-46px}}
  #night{position:absolute;inset:0;background:#3b2a6b;opacity:0;pointer-events:none;transition:opacity .45s}
  /* control bar */
  #caption{width:min(820px,calc(100% - 24px));margin:0 0 14px;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;
    background:rgba(255,248,238,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:30px;
    box-shadow:0 10px 30px rgba(20,8,0,.35);position:relative;z-index:2}
  #caption .txt{flex:1;min-width:0}
  #story{font-size:18px;line-height:1.6;margin:0;min-height:28px;cursor:pointer}
  #hint{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:14px;color:#c4475a;font-family:system-ui,sans-serif;min-height:20px}
  #hint svg{flex:none}
  .nav{width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s,background .2s,width .25s}
  .nav:hover{background:rgba(58,43,63,.08)}
  .nav:disabled{opacity:.25;cursor:default;background:transparent}
  .nav:active{transform:scale(.94)}
  #next.ready{background:var(--ink);color:#fff;width:60px;border-radius:24px;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,127,165,.6)}50%{box-shadow:0 0 0 10px rgba(242,127,165,0)}}
  #dots{display:flex;gap:6px;margin-top:8px}
  #dots i{width:7px;height:7px;border-radius:4px;background:rgba(58,43,63,.2);transition:width .3s,background .3s}
  #dots i.on{width:22px;background:var(--ink)}
  /* card */
  #card{position:fixed;inset:0;display:grid;place-items:center;background:rgba(40,15,30,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
  #card.show{opacity:1;pointer-events:auto}
  #card .box{width:min(380px,calc(100% - 32px));background:#fff8ee;border-radius:22px;padding:18px 18px 16px;box-shadow:0 0 0 4px #fff,0 20px 50px rgba(0,0,0,.4);
    transform:scale(.9);transition:transform .3s cubic-bezier(.3,1.5,.5,1);text-align:center}
  #card.show .box{transform:scale(1)}
  #card h3{margin:2px 0 8px;font-size:18px}
  #card p{margin:10px 4px 14px;font-size:16px;line-height:1.6}
  #card button{border:0;background:var(--ink);color:#fff8ea;border-radius:22px;padding:10px 26px;font:inherit;font-size:15px;cursor:pointer}
  .restart{border:0;background:var(--ink);color:#fff;border-radius:22px;padding:9px 20px;font:inherit;font-size:15px;cursor:pointer;margin-top:4px}
  #rot{display:none}
  @media (orientation:portrait) and (max-width:700px){ #rot{display:flex} }
  @media (max-width:640px){
    #story{font-size:15px} #caption{padding:8px 8px 8px 10px;gap:6px} .nav{width:40px;height:40px}
    .pill span{display:none} .pill b{font-size:21px} #pageName{display:none}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="pStripe" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="7" fill="#fff" opacity=".16"/></pattern>
  <pattern id="pStripeV" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="3.5" height="8" fill="#000" opacity=".08"/><rect x="3.5" width="1" height="8" fill="#fff" opacity=".18"/></pattern>
  <pattern id="pDots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.9" fill="#fff" opacity=".55"/><circle cx="11" cy="11" r="1.9" fill="#fff" opacity=".55"/></pattern>
  <pattern id="pDotsS" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1.1" fill="#fff" opacity=".6"/><circle cx="7" cy="7" r="1.1" fill="#fff" opacity=".6"/></pattern>
  <pattern id="pZig" width="16" height="12" patternUnits="userSpaceOnUse"><path d="M0 8 L4 4 L8 8 L12 4 L16 8" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1.6"/></pattern>
  <pattern id="pWeave" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(28)"><rect width="10" height="3" fill="#7a3f10" opacity=".16"/><rect y="5" width="10" height="1" fill="#fff" opacity=".3"/></pattern>
  <pattern id="pDiag" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="4" fill="#fff" opacity=".22"/></pattern>
</defs></svg>
<div id="app">
  <header>
    <div class="pill"><b>拔苗助长</b><span>成语立体互动书 · 剪纸版</span></div>
    <div class="pill" id="rot"><span style="letter-spacing:.04em">横屏或用平板、电脑打开更顺手</span></div>
    <div class="pill" id="pageName"><i></i><em style="font-style:normal" id="pageNameT">封面</em></div>
  </header>
  <div id="stageWrap">
    <div id="fit">
      <div id="world">
        <div id="scene" class="closed">
          <div id="board"></div>
          <div id="base" class="paper"><div class="spine"></div><div id="decals"></div></div>
          <div id="back" class="cover">
            <div class="face front paper" id="backdrop"></div>
            <div class="face rear paper" id="rear"></div>
          </div>
          <div id="pieces"></div>
        </div>
      </div>
    </div>
    <div id="ui">
      <div class="chip" id="day">第 1 天</div>
      <div id="can" aria-label="水壶"></div>
    </div>
  </div>
  <div id="caption">
    <button class="nav" id="prev" aria-label="上一页"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="txt">
      <p id="story"></p>
      <div id="hint"></div>
      <div id="dots"></div>
    </div>
    <button class="nav" id="snd" aria-label="声音开关"></button>
    <button class="nav" id="next" aria-label="下一页"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<div id="card"><div class="box"><h3 id="cardTitle"></h3><div id="cardArt"></div><p id="cardText"></p><button id="cardClose">知道了</button></div></div>

<script>
(() => {
const W = 920, H = 440;
const $ = s => document.querySelector(s);
const piecesEl = $('#pieces'), decalsEl = $('#decals'), back = $('#back');
const backdrop = $('#backdrop'), rear = $('#rear');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const EDGE = '#fffaf2';

/* ---------- sound: synthesized SFX, pentatonic music box, narration ---------- */
const SND = (() => {
  let ctx=null, master=null, sfxBus=null, musBus=null, on=true, unlocked=false, musicTimer=null, lastSpoken='';
  try { on = localStorage.getItem('bm_sound') !== 'off'; } catch(e){}
  function ac(){
    if (!ctx){
      const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
      ctx = new A(); master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination);
      sfxBus = ctx.createGain(); sfxBus.gain.value = .9; sfxBus.connect(master);
      musBus = ctx.createGain(); musBus.gain.value = .32; musBus.connect(master);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  let nbuf=null;
  function noiseBuf(){ if(nbuf) return nbuf; const c=ctx; nbuf=c.createBuffer(1,c.sampleRate*1.5,c.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; return nbuf; }
  function noise(dur,{f=1500,f2=null,q=1,type='bandpass',vol=.3,at=.004,delay=0}={}){
    const c=ac(); if(!c||!on) return; const t=c.currentTime+delay;
    const src=c.createBufferSource(); src.buffer=noiseBuf();
    const fl=c.createBiquadFilter(); fl.type=type; fl.Q.value=q; fl.frequency.setValueAtTime(f,t); if(f2) fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+at); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    src.connect(fl).connect(g).connect(sfxBus); src.start(t, Math.random()); src.stop(t+dur+.05);
  }
  function tone(freq,dur,{type='sine',vol=.25,slide=null,delay=0,at=.006,bus=null}={}){
    const c=ac(); if(!c||!on) return; const t=c.currentTime+delay;
    const o=c.createOscillator(); o.type=type; o.frequency.setValueAtTime(freq,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur*.9);
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+at); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
    o.connect(g).connect(bus||sfxBus); o.start(t); o.stop(t+dur+.05);
  }
  // C major pentatonic, gentle
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
  const arp=(idx,step=.07,vol=.14,type='triangle')=>idx.forEach((k,i)=>tone(PENTA[k],.35,{type,vol,delay:i*step}));
  function music(start){
    clearTimeout(musicTimer); if(!start) return;
    let i=0, pos=2;
    const bass=[130.81,98,110,87.31];
    const tick=()=>{
      if(!on){ musicTimer=setTimeout(tick,600); return; }
      if(i%8===0) tone(bass[(i/8)%4|0],2.6,{type:'sine',vol:.11,bus:musBus,at:.08});
      if(Math.random()<.82){ pos=Math.max(0,Math.min(7,pos+[-2,-1,-1,0,1,1,2][Math.random()*7|0]));
        tone(PENTA[pos],1.1,{type:'sine',vol:.09,bus:musBus}); tone(PENTA[pos]*2,.5,{type:'sine',vol:.015,bus:musBus}); }
      i++; musicTimer=setTimeout(tick, i%4===0?620:420);
    };
    musicTimer=setTimeout(tick,300);
  }
  // narration: prefer pre-generated Microsoft neural voice files (audio/*.mp3), else browser voices (Edge: Xiaoxiao / Yunjian)
  const clean = t => t.replace(/<[^>]+>/g,'').replace(/[“”]/g,'').trim();
  const keyOf = t => { let h=5381; for (const ch of t) h=((h*33)^ch.codePointAt(0))>>>0; return h.toString(16); };
  let narr=null, man=null, files=null;
  function pickVoice(){ try{
    const v=speechSynthesis.getVoices().filter(x=>/^zh[-_](CN|Hans)/i.test(x.lang)||/^zh$/i.test(x.lang));
    const pref=(res)=>{ for(const r of res){ const f=v.find(x=>r.test(x.name)); if(f) return f; } return null; };
    narr = pref([/Xiaoxiao.*(Natural|Online)/i,/Xiaoyi.*(Natural|Online)/i,/(Natural|Online)/i,/Xiaoxiao|Tingting|Ting-Ting|Huihui|female|女/i]) || v[0] || null;
    man  = pref([/Yunjian.*(Natural|Online)/i,/Yunyang.*(Natural|Online)/i,/Yunxi.*(Natural|Online)/i,/Kangkang|Yunyang|male|男/i]) || narr;
  }catch(e){} }
  try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
  const natural = v => v && /Natural|Online/i.test(v.name);
  let cur=null, queue=[];
  window.__spoken = [];
  function stopAll(){ queue=[]; if(cur){ try{cur.pause();}catch(e){} cur=null; } try{speechSynthesis.cancel();}catch(e){} }
  function playNext(){
    if(cur || !queue.length) return;
    const k=queue.shift(); const a=new Audio('audio/'+k+'.mp3'); cur=a;
    const done=()=>{ if(cur===a){ cur=null; playNext(); } };
    a.onended=done; a.onerror=done; a.play().catch(done);
  }
  function speak(text,{who='narr',interrupt=false}={}){
    if(!on||!unlocked) return; const t=clean(text); if(!t) return; const k=keyOf(t);
    window.__spoken.push({k,t,who});
    if(interrupt) stopAll();
    if(files && files.has(k)){ queue.push(k); playNext(); return; }
    try{
      const v = who==='man' ? man : narr;
      const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; if(v) u.voice=v;
      u.rate = natural(v) ? 1 : (who==='man' ? .95 : .88);
      u.pitch = natural(v) ? 1 : (who==='man' ? .8 : 1.1);
      speechSynthesis.speak(u);
    }catch(e){}
  }
  function loadFiles(){ try{ fetch('audio/lines.json').then(r=>r.ok?r.json():null).then(j=>{ if(j&&j.lines) files=new Set(j.lines.map(l=>l.key)); }).catch(()=>{}); }catch(e){} }
  const api = {
    get on(){ return on; },
    unlock(){ if(unlocked) return; unlocked=true; ac(); music(true); },
    toggle(){ on=!on; try{localStorage.setItem('bm_sound',on?'on':'off');}catch(e){}
      if(ctx) master.gain.setTargetAtTime(on?1:0, ctx.currentTime, .05);
      if(!on){ stopAll(); } else { ac(); if(lastSpoken) speak(lastSpoken,{interrupt:true}); }
      return on; },
    story(text){ const t=clean(text); if(t===lastSpoken) return; lastSpoken=t; speak(t,{interrupt:true}); },
    replay(){ if(lastSpoken) speak(lastSpoken,{interrupt:true}); },
    line(text){ speak(text,{who:'man'}); },
    loadFiles,
    hush(){ stopAll(); },
    tick(){ tone(1400,.05,{type:'triangle',vol:.06}); },
    pop(i=0){ noise(.07,{f:1800+Math.random()*900,q:2.5,vol:.16}); tone(320+i*12,.09,{type:'triangle',vol:.05}); },
    flip(){ noise(.45,{f:500,f2:3500,q:.8,vol:.22,at:.08}); noise(.12,{f:180,type:'lowpass',vol:.25,delay:.38}); },
    open(){ noise(.7,{f:300,f2:2600,q:.7,vol:.25,at:.15}); noise(.16,{f:150,type:'lowpass',vol:.35,delay:.62}); arp([2,4,5,7],.09,.08,'sine'); },

const mix = (a,b,t) => { const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); };

const tp = (d, fill, pat, sw=2.6) => `<path d="${d}" fill="${fill}" stroke="${EDGE}" stroke-width="${sw}" stroke-linejoin="round"/>` + (pat?`<path d="${d}" fill="url(#${pat})"/>`:'');

const star = (x,y,r,col='#fff6d8') => `<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${col}"/>`;

function leaf(x,y,ang,len,w,col){
  const a = ang*Math.PI/180, tx = x+Math.cos(a)*len, ty = y+Math.sin(a)*len;
  const nx = -Math.sin(a)*w, ny = Math.cos(a)*w;
  const mx = x+Math.cos(a)*len*.45, my = y+Math.sin(a)*len*.45;
  const vx = x+Math.cos(a)*len*.78, vy = y+Math.sin(a)*len*.78;
  return `<path d="M${x},${y} Q${mx+nx},${my+ny} ${tx},${ty} Q${mx-nx},${my-ny} ${x},${y}Z" fill="${col}" stroke="${EDGE}" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M${x},${y} L${vx},${vy}" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>`;
}
function seedlingSVG({g=0,pull=0,wilt=0,grain=false,fallen=false}){
  const VW=90, VH=230, gx=45, y0 = VH - pull;
  const h = 22 + g*130;
  const col = wilt>0.8 ? mix(C.wilt,C.dry,Math.min(1,(wilt-.8)*5)) : mix(C.leaf,C.wilt,wilt);
  const scol = wilt>0.8 ? C.dry : mix(C.stem,C.wilt,wilt);
  const tipX = gx + wilt*30, tipY = y0 - h*(1-.42*wilt);
  let s = `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMax meet">`;
  s += `<g ${fallen?`transform="rotate(38 ${gx} ${y0})"`:''}>`;
  if (pull>0){
    const rc = wilt>.5 ? '#e6c79a' : C.root;
    for (let i=0;i<5;i++){
      const ex = gx + (i-2)*7, ey = Math.min(VH, y0 + 14 + (i%2)*9);
      s += `<path d="M${gx},${y0} Q${gx+(i-2)*2},${y0+8} ${ex},${ey}" stroke="${rc}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
    }
    s += `<ellipse cx="${gx}" cy="${y0+3}" rx="9" ry="4" fill="#9a4a33" opacity=".85"/>`;
  }
  const stem = `M${gx},${y0} Q${gx},${y0-h*.62} ${tipX},${tipY}`;
  s += `<path d="${stem}" stroke="${EDGE}" stroke-width="${7+g*1.6}" fill="none" stroke-linecap="round"/>`;
  s += `<path d="${stem}" stroke="${scol}" stroke-width="${3.6+g*1.6}" fill="none" stroke-linecap="round"/>`;
  const n = 2 + Math.round(g*3);
  for (let i=0;i<n;i++){
    const t = (i+1)/(n+1.2);
    const px = gx + (tipX-gx)*t*t, py = y0 + (tipY-y0)*t;
    const side = i%2 ? 1 : -1;
    const base = side>0 ? -48 : -132;
    const ang = base + wilt*(side>0? 95 : -95);
    s += leaf(px,py,ang,16+g*30,3.6+g*2.8,i%2?col:mix(col,'#2f7d2a',.2));
  }
  s += leaf(tipX,tipY,-90 + wilt*120, 12+g*20, 3.2+g*2, col);
  if (grain){
    for (let i=0;i<7;i++){
      const t=i/6, gx2 = tipX + 6 + t*16, gy2 = tipY + 2 + t*t*22;
      s += `<ellipse cx="${gx2}" cy="${gy2}" rx="4.8" ry="7.2" transform="rotate(${-30+t*50} ${gx2} ${gy2})" fill="${C.grain}" stroke="${EDGE}" stroke-width="1.6"/>`;
      s += `<circle cx="${gx2-1}" cy="${gy2-2}" r="1.2" fill="#fff" opacity=".7"/>`;
    }
  }
  s += `</g></svg>`;
  return s;
}

  // cloth spine along the hinge + frame
  s += `<rect x="0" y="0" width="${W}" height="24" fill="#5b4a8f"/><rect x="0" y="0" width="${W}" height="24" fill="url(#pDotsS)"/>
    <path d="M0 24 H${W}" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>

  return s + `</svg>`;
}

/* ---------- state ---------- */
const XS = [250,385,520,655,790];
const ROW = { back:200, front:330 };
let S;
function reset(){
  S = { page:0, day:1, back:XS.map(()=>({planted:false,g:0,pull:0,pulled:false,watered:false})),
        front:XS.map(()=>({planted:false,g:0,pull:0,pulled:false,watered:false})), farmerHelped:false, lookedRoot:false, praised:false };
}
reset();

/* ---------- piece management ---------- */
let pieces = [];
function addPiece({x,z,w,h,html,cls='',data}){
  const el = document.createElement('div');
  el.className = 'piece folded ' + cls;
  el.style.left = (x - w/2) + 'px'; el.style.width = w+'px'; el.style.height = h+'px';
  el.innerHTML = html;
  const p = {el,z,x,w,h,data,up:false};
  setFold(p,true);
  piecesEl.appendChild(el); pieces.push(p); return p;
}
function setFold(p,folded){
  p.el.classList.toggle('folded',folded);
  p.el.style.transform = `translateZ(${p.z}px) rotateX(${folded?-90:0}deg)`;
  p.el.style.opacity = folded ? (p.up ? 1 : 0) : 1;
  p.up = !folded;
}
async function popAll(){
  const order = [...pieces].sort((a,b)=>a.z-b.z);
  let k=0; for (const p of order){ setFold(p,false); SND.pop(k++); await sleep(70); }
}
async function foldAll(){
  const order = [...pieces].sort((a,b)=>b.z-a.z);
  order.forEach((p,i)=>setTimeout(()=>setFold(p,true), i*30));
  await sleep(order.length*30 + 430);
  piecesEl.innerHTML=''; pieces=[];
}
function decal(html){ decalsEl.insertAdjacentHTML('beforeend', html); }
function shadow(x,z,w){ decal(`<div class="shadow" style="left:${x-w/2}px;top:${z-12}px;width:${w}px;height:28px"></div>`); }

function scenery(){
  decal(`<div class="decal" style="left:170px;top:120px;width:700px;height:280px">${fieldSVG()}</div>`);
  decal(`<div class="decal" style="left:0;top:404px;width:920px;height:36px">${grassSVG()}</div>`);
  addPiece({x:460,z:46,w:920,h:110,html:hillsSVG()});
  addPiece({x:84,z:118,w:140,h:120,html:hutSVG()});
  addPiece({x:70,z:420,w:160,h:110,html:bushSVG(false)});
  addPiece({x:860,z:420,w:160,h:110,html:bushSVG(true)});
}
const seedPieces = {back:[],front:[]};
function addSeedlings(viewFn, opts={}){
  seedPieces.back=[]; seedPieces.front=[];
  for (const row of ['back','front']){
    S[row].forEach((s,i)=>{
      if (!s.planted) return;
      const x = XS[i], z = ROW[row];
      shadow(x,z,70);
      const p = addPiece({x,z,w:90,h:230,html:`<div class="hit" style="width:100%;height:100%">${seedlingSVG(viewFn(s,row))}</div>`,cls:'seed',data:{row,i}});
      seedPieces[row][i]=p;
      if (opts.each) opts.each(p,row,i,s);
    });
  }
}
function redrawSeed(row,i,view){
  const p = seedPieces[row][i]; if(!p) return;
  p.el.querySelector('.hit').innerHTML = seedlingSVG(view);
}
let farmer=null;
function addFarmer(x,z,pose,mood){
  shadow(x,z,90);
  farmer = addPiece({x,z,w:120,h:200,html:farmerSVG(pose,mood)});
  return farmer;
}
function setFarmer(pose,mood){ if(farmer) farmer.el.innerHTML = farmerSVG(pose,mood); }

/* ---------- UI helpers ---------- */
const story = $('#story'), hint = $('#hint');
const HAND = `<svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4.3 15a1.5 1.5 0 0 1 2.4-1.8L9 15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function setText(t,h){ story.innerHTML = t; SND.story(t); hint.innerHTML = h ? HAND + `<span>${h}</span>` : ''; }
function ready(on=true){ $('#next').classList.toggle('ready',on); }
let bubbleTimer;
function say(text, el = farmer && farmer.el, ms=2600){
  document.querySelectorAll('.bubble').forEach(b=>b.remove());
  if(!el) return;
  const r = el.getBoundingClientRect(), u = $('#ui').getBoundingClientRect();
  const b = document.createElement('div'); b.className='bubble'; b.textContent=text;
  b.style.left = (r.left + r.width/2 - u.left) + 'px'; b.style.top = (r.top - u.top - 8) + 'px';
  $('#ui').appendChild(b);
  const bw = b.offsetWidth, uw = u.width, cx = parseFloat(b.style.left);
  b.style.left = Math.max(bw/2+8, Math.min(uw-bw/2-8, cx)) + 'px';
  requestAnimationFrame(()=>b.classList.add('show')); SND.line(text);
  clearTimeout(bubbleTimer); bubbleTimer = setTimeout(()=>{b.classList.remove('show'); setTimeout(()=>b.remove(),300)}, ms);
}
function floatText(text, el){
  const r = el.getBoundingClientRect(), u = $('#ui').getBoundingClientRect();
  const f = document.createElement('div'); f.className='pop'; f.textContent=text;
  f.style.left = (r.left + r.width/2 - u.left)+'px'; f.style.top = (r.top - u.top + 10)+'px';
  $('#ui').appendChild(f); setTimeout(()=>f.remove(),1200);
}
function dots(){
  $('#dots').innerHTML = PAGES.map((_,i)=>`<i class="${i===S.page?'on':''}"></i>`).join('');
  $('#prev').disabled = S.page===0;
  $('#next').disabled = S.page===PAGES.length-1;
  $('#pageNameT').textContent = PAGES[S.page].name;
}

          await sleep(320); setFarmer('stand','smile');
        }
        farmer.el.style.left = (150-60)+'px';
        S.farmerHelped = true;
        await sleep(300);
        say('一下子就长高了，真好！');
      }
      setText('后面那排，农夫全拔高了。<b>前面这一排交给你</b>：你想怎么帮禾苗？', '往上拖禾苗＝拔一拔；把水壶拖到禾苗上＝浇浇水；也可以都不动');

function plant(row,i){
  const s = S[row][i]; s.planted = true; s.g = 0; SND.plant();
  const x = XS[i], z = ROW[row];
  shadow(x,z,70);
  const p = addPiece({x,z,w:90,h:230,html:`<div class="hit" style="width:100%;height:100%">${seedlingSVG({g:0})}</div>`,cls:'seed',data:{row,i}});
  seedPieces[row][i]=p;
  requestAnimationFrame(()=>requestAnimationFrame(()=>setFold(p,false)));
  checkPlanted();
}
function checkPlanted(){
  const left = [...S.back,...S.front].filter(s=>!s.planted).length;
  if (left===0){ setText('从前，有个农夫在田里种下了禾苗。', '种好啦！翻到下一页'); ready(true); say('种好了，快快长大吧！'); }
  else ready(false);
}
function plantAll(){ [...S.back,...S.front].forEach(s=>{ if(!s.planted){ s.planted=true; } }); }

let sunEl=null, sunT=0;
function setupSun(){
  sunEl = document.createElement('div');
  sunEl.style.cssText = 'position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;cursor:grab;touch-action:none;z-index:2;filter:drop-shadow(0 4px 3px rgba(60,20,40,.3))';
  sunEl.innerHTML = `<svg viewBox="0 0 110 110">${sunArt(55,55,34,true)}</svg>`;
  backdrop.appendChild(sunEl);
  const night = document.createElement('div'); night.id='night'; backdrop.appendChild(night);
  placeSun(0);
  let drag=false, moved=false, busy=false;
  const toT = e => { const r = backdrop.getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX - r.left)/r.width)); };
  sunEl.addEventListener('pointerdown', e=>{ if(busy) return; drag=true; moved=false; sunEl.setPointerCapture(e.pointerId); e.stopPropagation(); });
  sunEl.addEventListener('pointermove', e=>{ if(!drag) return; moved=true; const t=toT(e); placeSun(t); if(t>.9){ drag=false; busy=true; nextDay().then(()=>busy=false); } });
  sunEl.addEventListener('pointerup', async e=>{ if(!drag) return; drag=false;
    if(!moved){ busy=true; for(let t=sunT;t<=1;t+=.04){ placeSun(t); await sleep(28);} await nextDay(); busy=false; }
    else placeSun(sunT); });
}
function placeSun(t){ sunT=t; if(!sunEl) return; sunEl.style.left = (60 + t*800)+'px'; sunEl.style.top = (150 - Math.sin(t*Math.PI)*90)+'px'; }
async function nextDay(){
  const night = $('#night'); night.style.opacity = .7; SND.night(); await sleep(450);
  S.day++; [...S.back,...S.front].forEach(s=> s.g = Math.min(.2, s.g + .05));
  for (const row of ['back','front']) S[row].forEach((s,i)=>redrawSeed(row,i,{g:s.g}));
  placeSun(0); $('#day').textContent = `第 ${S.day} 天`;
  night.style.opacity = 0; SND.day(); await sleep(400);
  const lines = ['嗯……好像长高了一点点？','怎么长得这么慢呀？','唉，要等到什么时候呀！'];
  say(lines[Math.min(S.day-2, lines.length-1)]);
  if (S.day>=4){ ready(true); setText('农夫天天到田边看。禾苗长得真慢呀，好像一点也没长高。农夫急得团团转。', '翻到下一页，看看农夫想了什么办法'); }
}

function armPull(p,i){
  p.el.classList.add('can-pull');
  let sy=0, drag=false;
  p.el.addEventListener('pointerdown', e=>{ if(S.page!==3||!S.farmerHelped||S.front[i].pulled) return; drag=true; sy=e.clientY; p.el.setPointerCapture(e.pointerId); p.el.style.cursor='grabbing'; });
  p.el.addEventListener('pointermove', e=>{ if(!drag) return; const s=S.front[i]; s.pull = Math.max(0,Math.min(40,(sy-e.clientY)*.55)); redrawSeed('front',i,{g:s.g,pull:s.pull}); });
  p.el.addEventListener('pointerup', ()=>{ if(!drag) return; drag=false; p.el.style.cursor='';
    const s=S.front[i];
    if (s.pull>12){ SND.pull(); setTimeout(()=>SND.sparkle(),250); s.pull=30; s.pulled=true; p.el.classList.remove('can-pull'); floatText('长高啦！',p.el);
      if(!S.praised){ S.praised=true; setTimeout(()=>say('看，一下子就长高了！'),300); } }
    else s.pull=0;
    redrawSeed('front',i,{g:s.g,pull:s.pull});
  });
}
function setupCan(){
  const can = $('#can'), ui=$('#ui');
  can.innerHTML = `<svg viewBox="0 0 96 80" width="96" height="80">
    <path d="M64 44 L90 24" stroke="${EDGE}" stroke-width="11" stroke-linecap="round"/><path d="M64 44 L90 24" stroke="#2fa39a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="91" cy="22" rx="7" ry="5" transform="rotate(-38 91 22)" fill="#f6a04d" stroke="${EDGE}" stroke-width="2"/>
    <path d="M22 30 Q40 4 58 30" stroke="${EDGE}" stroke-width="9" fill="none"/><path d="M22 30 Q40 4 58 30" stroke="#f27fa5" stroke-width="5" fill="none"/>
    ${tp('M20 30 h40 a4 4 0 0 1 4 4 v34 a6 6 0 0 1 -6 6 h-36 a6 6 0 0 1 -6 -6 v-34 a4 4 0 0 1 4 -4z','#2fa39a','pDots',2.8)}
    <rect x="22" y="44" width="38" height="8" rx="4" fill="#fbd35a" stroke="${EDGE}" stroke-width="1.6"/></svg><span class="lbl">水壶</span>`;
  const home = () => { const r = ui.getBoundingClientRect(); can.style.left = (r.width - 130)+'px'; can.style.top = (r.height*0.12)+'px'; can.style.transform=''; };
  home(); addEventListener('resize', home);
  let drag=false, ox=0, oy=0, target=-1, pouring=null;
  const spout = () => { const r=can.getBoundingClientRect(); return {x:r.left+r.width*.95, y:r.top+r.height*.28}; };
  const findTarget = () => { const sp = spout(); let best=-1, bd=1e9;
    seedPieces.front.forEach((p,i)=>{ if(!p) return; const r=p.el.getBoundingClientRect(); const cx=r.left+r.width/2;
      const d=Math.abs(sp.x-cx); if(d<r.width*.6 && sp.y < r.bottom && sp.y > r.top-120 && d<bd){bd=d;best=i;} });
    return best; };
  can.addEventListener('pointerdown', e=>{ if(S.page!==3||!S.farmerHelped) return; drag=true; can.classList.add('drag'); can.setPointerCapture(e.pointerId);
    const r=can.getBoundingClientRect(); ox=e.clientX-r.left; oy=e.clientY-r.top; });
  can.addEventListener('pointermove', e=>{ if(!drag) return; const u=ui.getBoundingClientRect();
    can.style.left=(e.clientX-u.left-ox)+'px'; can.style.top=(e.clientY-u.top-oy)+'px';
    const t=findTarget();
    if (t!==target){ target=t; clearInterval(pouring); pouring=null; can.style.transform = t>=0 ? 'rotate(28deg)' : '';
      if (t>=0){ let n=0; pouring=setInterval(()=>{ drip(); if(++n===8) water(t); },110); } }
  });
  const end = ()=>{ if(!drag) return; drag=false; clearInterval(pouring); pouring=null; target=-1; can.classList.remove('drag'); home(); };
  can.addEventListener('pointerup', end); can.addEventListener('pointercancel', end);
  function drip(){ SND.drip(); const sp=spout(), u=ui.getBoundingClientRect();
    for(let k=0;k<2;k++){ const d=document.createElement('div'); d.className='drop'; d.style.left=(sp.x-u.left+Math.random()*10-5)+'px'; d.style.top=(sp.y-u.top+6)+'px'; ui.appendChild(d); setTimeout(()=>d.remove(),720);} }
  function water(i){ const s=S.front[i]; if(s.watered) return; s.watered=true; SND.gulp(); const w=$('#wet'+i); if(w) w.classList.add('on'); floatText('喝饱啦', seedPieces.front[i].el); }
}

function rootArt(s){
  const pulled = s.pulled;
  const gg=Math.max(s.g,.35); const plant = seedlingSVG(pulled ? {g:gg,pull:28,wilt:1} : {g:gg+.25}).replace(/<\/?svg[^>]*>/g,'');
  let roots='';
  if (!pulled){
    for(let i=0;i<7;i++){ const ex=150+(i-3)*22, ey=150+30+(i%3)*14; roots+=`<path d="M150 120 Q${150+(i-3)*8} 140 ${ex} ${ey}" stroke="#fff1d6" stroke-width="3.4" fill="none" stroke-linecap="round"/>`; }
    for(let i=0;i<6;i++){ roots+=`<ellipse cx="${80+i*30}" cy="${150+(i%2)*20}" rx="4" ry="5.6" fill="#6fc9e8" stroke="#fff" stroke-width="1.4"/>`; }
  }
  return `<svg viewBox="0 0 300 200" width="100%" style="max-width:300px;border-radius:14px;background:#b9e5d6">
    <rect width="300" height="120" fill="url(#pStripe)"/>
    <rect x="0" y="120" width="300" height="80" fill="#c4603f"/><rect x="0" y="120" width="300" height="80" fill="url(#pStripeV)"/>
    <path d="M0 122 L300 122" stroke="#fffaf2" stroke-width="4"/>
    ${roots}
    <g transform="translate(150 120) scale(1.45) translate(-45 -230)">${plant}</g>
    ${pulled?`<path d="M150 120 L150 104" stroke="#fbd35a" stroke-width="2" stroke-dasharray="3 3"/><rect x="176" y="96" width="90" height="24" rx="12" fill="#fff8ee"/><text x="221" y="113" text-anchor="middle" font-size="13" fill="#6b3a3a">根悬在空中</text>`:''}
  </svg>`;
}
function showRoot(row,i){
  const s = S[row][i];
  $('#cardTitle').textContent = s.pulled ? '拔过的禾苗' : (s.watered ? '浇过水、没拔的禾苗' : '没拔的禾苗');
  $('#cardArt').innerHTML = rootArt(s);
  $('#cardText').innerHTML = s.pulled
    ? (s.watered ? '虽然浇了水，可是<b>根已经离开了泥土</b>，喝不到水，所以蔫了。' : '往上一拔，<b>根就离开了泥土</b>，喝不到水，也吸不到养分，所以蔫了。')
    : '根还<b>扎在泥土里</b>，能喝到水，过了一夜，又悄悄长高了一点。';
  $('#card').classList.add('show'); SND.card(); setTimeout(()=> s.pulled ? SND.sad() : SND.good(), 250);
  SND.story($('#cardText').innerHTML);
  if (!S.lookedRoot){ S.lookedRoot = true; }
}
$('#cardClose').onclick = () => { $('#card').classList.remove('show'); if(S.page===4){ ready(true); hint.innerHTML = HAND + '<span>再点点别的禾苗，比一比；看完翻到下一页</span>'; } };

let busy=false;
async function go(n, fromEnd){
  if (busy || n<0 || n>=PAGES.length) return;
  busy = true;
  document.querySelectorAll('.bubble').forEach(b=>b.remove());
  $('#day').classList.remove('show'); $('#can').classList.remove('show');
  if (S.page===1 && n>1) plantAll();
  const wasCover = S.page===0 && !fromEnd;
  const scene = $('#scene');
  if (wasCover){ scene.classList.remove('closed'); SND.open(); await sleep(700); }
  if (!wasCover){
    if (n===0) SND.close(); else SND.flip();
    await foldAll();
    back.classList.remove('cover'); rear.innerHTML = '';
    back.style.transform = 'rotateX(-90deg)';
    await sleep(560);
  }
  decalsEl.innerHTML='';
  S.page = n; dots();
  const pg = PAGES[n];
  if (pg.cover){
    back.classList.add('cover'); rear.innerHTML = coverSVG(); backdrop.innerHTML = backdropSVG('morning'); pg.build();
    scene.classList.add('closed'); await sleep(900); busy=false; return;
  }
  backdrop.innerHTML = backdropSVG(pg.sky, !pg.sunInteractive);
  sunEl=null;
  pg.build();
  if (pg.sunInteractive) setupSun();
  back.style.transform = 'rotateX(0deg)';
  await sleep(420);
  await popAll();
  if (pg.after) await pg.after();
  if (pg.can) $('#can').classList.add('show');
  busy=false;
}
$('#next').onclick = () => go(S.page+1);
const SPK_ON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
const SPK_OFF = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`;
const sndBtn = $('#snd'); const paintSnd = () => { sndBtn.innerHTML = SND.on ? SPK_ON : SPK_OFF; sndBtn.setAttribute('aria-pressed', SND.on); };
paintSnd(); sndBtn.onclick = () => { SND.unlock(); SND.toggle(); paintSnd(); };
story.onclick = () => SND.replay();
$('#prev').onclick = () => go(S.page-1);

rear.innerHTML = coverSVG();
backdrop.innerHTML = backdropSVG('morning');
back.style.transform = 'rotateX(-90deg)';
setupCan();
fit(); dots(); PAGES[0].build();
window.__go = go; window.__S = () => S;
})();
</script>
